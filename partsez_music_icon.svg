<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="1" stop-color="#0b0b1f"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff3d81"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#ff3d81"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ff3d81" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff3d81" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- fon -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#glow)"/>

  <!-- border -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#border)" stroke-width="14"/>
  <rect x="34" y="34" width="444" height="444" rx="80" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- music nyshan -->
  <g filter="url(#soft)">
    <ellipse cx="205" cy="228" rx="38" ry="30" transform="rotate(-20 205 228)" fill="url(#note)"/>
    <ellipse cx="305" cy="206" rx="38" ry="30" transform="rotate(-20 305 206)" fill="url(#note)"/>
    <rect x="228" y="92" width="14" height="136" rx="6" fill="url(#note)"/>
    <rect x="328" y="70" width="14" height="136" rx="6" fill="url(#note)"/>
    <path d="M228 92 L342 70 L342 108 L228 130 Z" fill="url(#note)"/>
  </g>

  <!-- 3D PARTSEZ -->
  <g font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="256" y="344" font-size="84" fill="#5a1236">PARTSEZ</text>
    <text x="256" y="340" font-size="84" fill="#7a1a48">PARTSEZ</text>
    <text x="256" y="336" font-size="84" fill="#a02560">PARTSEZ</text>
    <text x="256" y="332" font-size="84" fill="#c9356f">PARTSEZ</text>
    <text x="256" y="328" font-size="84" fill="url(#face)" stroke="#ff3d81" stroke-width="2">PARTSEZ</text>

    <!-- 3D MUSIC -->
    <text x="256" y="428" font-size="70" fill="#5a3a00" letter-spacing="10">MUSIC</text>
    <text x="256" y="424" font-size="70" fill="#8a5a00" letter-spacing="10">MUSIC</text>
    <text x="256" y="420" font-size="70" fill="#c98a1a" letter-spacing="10">MUSIC</text>
    <text x="256" y="416" font-size="70" fill="url(#face)" stroke="#ff8a3d" stroke-width="2" letter-spacing="10">MUSIC</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
